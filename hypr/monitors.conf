# See https://wiki.hyprland.org/Configuring/Monitors/
# Format: monitor = [port], resolution, position, scale

# 27" 4K baseline (BenQ MA270U): readable UI while keeping sharpness.
# If text is still small, try scale 1.75. If too large, try 1.25.
# Fractional scales can blur some XWayland apps; 2.0 is crispest but much larger.

env = GDK_SCALE,1.75
monitor=,preferred,auto,1.666667

# Optional per-output override examples (uncomment and adjust connector name):
# monitor=DP-1,3840x2160@60,auto,1.5
# monitor=HDMI-A-1,3840x2160@60,auto,1.5
