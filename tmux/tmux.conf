# Use zsh as default
set -g default-shell /bin/zsh

# Set status bar to top
set-option -g status-position top

# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "tmux-256color" # Prefer the native tmux terminfo entry when available
set -ag terminal-overrides ",*:RGB"     # Enable true-color for compatible terminals

# General
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update the status bar every 3 seconds (default: 15 seconds)
# set -g automatic-rename off
# set -g allow-rename off

# Set prefix key
unbind C-b              # Unbind the default prefix key
set -g prefix C-Space   # Set new prefix key to Ctrl+Space

# Ask for the tab name when creating a new one in the same path
bind c command-prompt -p "New window name:" "new-window -n '%%' -c '#{pane_current_path}'"

# Refresh tmux config with r
unbind r
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# Split horizontally in CWD with /
unbind %
bind \/ split-window -h -c "#{pane_current_path}"

# Split vertically in CWD with -
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# Use vim arrow keys to resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Use m key to maximize pane
bind -r m resize-pane -Z

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi
bind v copy-mode \; send -X begin-selection

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection 

# Copy text with "y"
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  "bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "if-shell 'command -v wl-copy >/dev/null 2>&1' \
    \"bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'wl-copy'\" \
    \"if-shell 'command -v xclip >/dev/null 2>&1' \
      \\\"bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'\\\" \
      \\\"bind -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel\\\"\""

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer
 
# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# tpm plugin manager
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # Enable navigating between nvim and tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # Automatically saves sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-cpu'          # CPU and memory info
# set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and memory info for macOS
# set -g @plugin 'MunifTanjim/tmux-mode-indicator' # Status bar indicator

# Load theme
if-shell '[ "$TMUX_THEME" = "nord" ]' 'source-file $XDG_CONFIG_HOME/tmux/nord-theme.conf'

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Update installation plugins path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# NOTE:
# - To apply theme changes: tmux kill-server && rm -rf /tmp/tmux-*
# - To avoid overlap, disable the Mac shortcut to switch input sources with Ctrl+Space in
#   `System settings > Keyboard Shortcuts > Input Sources`
